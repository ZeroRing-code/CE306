<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3 - โปรแกรมบัญชีรายรับ-รายจ่าย</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #16a34a;
            --danger: #dc2626;
            --background: #f8fafc;
            --text: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1, h2 {
            text-align: center;
            color: var(--primary);
        }
        /* โจทย์ที่ 4: สรุปรายงานการเงิน */
        .summary-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        .card {
            padding: 15px 5px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
        .card.income { background-color: #dcfce7; color: var(--success); }
        .card.expense { background-color: #fee2e2; color: var(--danger); }
        .card.balance { background-color: #e0e7ff; color: var(--primary); }
        .card span { display: block; font-size: 1.3rem; margin-top: 5px; }

        /* Form Inputs */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }
        input, select, button {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
        }
        button.btn-add {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        /* โจทย์ที่ 2: ช่องค้นหารายการ Real-time */
        .filter-bar {
            margin-bottom: 20px;
        }
        .filter-bar input {
            border: 2px solid #e2e8f0;
        }

        /* โจทย์ที่ 1 & 3: รายการประวัติแบบ <ul> และ <li> */
        ul.transaction-history {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        ul.transaction-history li {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .li-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .li-title {
            font-weight: bold;
            font-size: 16px;
        }
        .li-meta {
            font-size: 12px;
            color: #64748b;
        }
        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 5px;
        }
        .badge.income { background: #dcfce7; color: var(--success); }
        .badge.expense { background: #fee2e2; color: var(--danger); }
        .li-amount {
            font-weight: bold;
            font-size: 16px;
        }
        .text-income { color: var(--success); }
        .text-expense { color: var(--danger); }

        /* โจทย์ที่ 5: ปุ่มล้างประวัติ */
        .clear-container {
            text-align: center;
            margin-top: 30px;
        }
        .btn-clear {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>บันทึกรายรับ-รายจ่าย</h1>

    <!-- โจทย์ที่ 4: แสดงสัดส่วนเงินรวมสุทธิ -->
    <div class="summary-box">
        <div class="card income">รายรับรวม <span id="total-income">฿0.00</span></div>
        <div class="card expense">รายจ่ายรวม <span id="total-expense">฿0.00</span></div>
        <div class="card balance">คงเหลือสุทธิ <span id="total-balance">฿0.00</span></div>
    </div>

    <!-- ฟอร์มกรอกข้อมูล -->
    <div class="form-group">
        <input type="text" id="tx-name" placeholder="ชื่อรายการ (เช่น เงินเดือน, ค่าวิน)">
        <select id="tx-type">
            <option value="income">รายรับ</option>
            <option value="expense">รายจ่าย</option>
        </select>
        
        <!-- โจทย์ที่ 1: เพิ่มตัวเลือก <select> หมวดหมู่ -->
        <select id="tx-category">
            <option value="🍕 อาหาร">🍕 อาหาร</option>
            <option value="🚗 เดินทาง">🚗 เดินทาง</option>
            <option value="🛍️ ช้อปปิ้ง">🛍️ ช้อปปิ้ง</option>
            <option value="💰 เงินเดือน">💰 เงินเดือน</option>
            <option value="✨ อื่นๆ">✨ อื่นๆ</option>
        </select>
        
        <input type="number" id="tx-amount" placeholder="จำนวนเงิน (บาท)">
        <button class="btn-add" onclick="addTransaction()">เพิ่มรายการ</button>
    </div>

    <!-- โจทย์ที่ 2: ช่อง Filter & Search Bar แบบ Real-time -->
    <div class="filter-bar">
        <input type="text" id="search-input" placeholder="🔍 ค้นหาชื่อรายการทันที..." oninput="renderDisplay()">
    </div>

    <h2>ประวัติรายการ</h2>
    
    <!-- โจทย์ที่ 1 & 3: ใช้โครงสร้างแท็ก <ul> และจะสร้าง <li> ด้านในด้วย JS -->
    <ul id="transaction-list" class="transaction-history"></ul>

    <!-- โจทย์ที่ 5: ปุ่มล้างประวัติทั้งหมดด้านล่างสุด -->
    <div class="clear-container">
        <button class="btn-clear" onclick="clearAllData()">ล้างข้อมูลทั้งหมด</button>
    </div>
</div>

<script>
    // โครงสร้างข้อมูลแบบ Array ของ Object ตามข้อกำหนด
    let transactions = [];
    let nextId = 1;

    function addTransaction() {
        const name = document.getElementById('tx-name').value.trim();
        const type = document.getElementById('tx-type').value;
        const category = document.getElementById('tx-category').value;
        const amount = parseFloat(document.getElementById('tx-amount').value);

        if (!name || isNaN(amount) || amount <= 0) {
            alert('กรุณากรอกข้อมูลชื่อรายการและจำนวนเงินให้ถูกต้อง');
            return;
        }

        // เก็บข้อมูลใน Object
        const transaction = {
            id: nextId++,
            name: name,
            type: type,
            category: category,
            amount: amount
        };

        transactions.push(transaction);
        
        // ล้างค่าในช่องกรอกหลังเพิ่มเสร็จ
        document.getElementById('tx-name').value = '';
        document.getElementById('tx-amount').value = '';

        renderDisplay();
    }

    // โจทย์ที่ 4: ฟังก์ชันคำนวณเงินรวม
    function updateSummary() {
        let totalIncome = 0;
        let totalExpense = 0;

        transactions.forEach(tx => {
            if (tx.type === 'income') totalIncome += tx.amount;
            else totalExpense += tx.amount;
        });

        const totalBalance = totalIncome - totalExpense;

        document.getElementById('total-income').innerText = `฿${totalIncome.toFixed(2)}`;
        document.getElementById('total-expense').innerText = `฿${totalExpense.toFixed(2)}`;
        document.getElementById('total-balance').innerText = `฿${totalBalance.toFixed(2)}`;
    }

    // โจทย์ที่ 1, 2, 3: ค้นหา Real-time และ Render ข้อมูลลงในแท็ก <li>
    function renderDisplay() {
        const searchKeyword = document.getElementById('search-input').value.toLowerCase();
        const listContainer = document.getElementById('transaction-list');
        listContainer.innerHTML = ''; // ล้างข้อมูลเก่าก่อนวาดใหม่

        // ค้นหาแบบ Real-time
        const filteredTransactions = transactions.filter(tx => 
            tx.name.toLowerCase().includes(searchKeyword)
        );

        // วนลูปสร้างแท็ก <li>
        filteredTransactions.forEach(tx => {
            const li = document.createElement('li');
            
            const typeText = tx.type === 'income' ? 'รายรับ' : 'รายจ่าย';
            const badgeClass = tx.type === 'income' ? 'badge income' : 'badge expense';
            const amountClass = tx.type === 'income' ? 'text-income' : 'text-expense';
            const amountPrefix = tx.type === 'income' ? '+' : '-';

            // จัดโครงสร้างให้แสดงผลตามเงื่อนไข (ID, ชื่อ, ประเภท, หมวดหมู่ร่วมกับไอคอน, จำนวนเงิน)
            li.innerHTML = `
                <div class="li-left">
                    <div class="li-title">${tx.category} ${tx.name}</div>
                    <div class="li-meta">
                        <span>ลำดับ: #${tx.id}</span>
                        <span class="${badgeClass}">${typeText}</span>
                    </div>
                </div>
                <div class="li-amount ${amountClass}">
                    ${amountPrefix}฿${tx.amount.toFixed(2)}
                </div>
            `;
            listContainer.appendChild(li);
        });

        updateSummary();
    }

    // โจทย์ที่ 5: ปุ่มล้างประวัติทั้งหมด พร้อมแสดง confirm() และเซ็ตค่าเป็น ฿0.0
    function clearAllData() {
        if (confirm('คุณต้องการล้างข้อมูลทั้งหมดใช่หรือไม่?')) {
            transactions = [];
            nextId = 1;
            document.getElementById('search-input').value = '';
            renderDisplay();
        }
    }
</script>
</body>
</html>
