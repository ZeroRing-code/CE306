<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS Epic Game - Assignment 5</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #f43f5e;
            --warning: #fbbf24;
            --border: #334155;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            align-items: center;
        }
        .container {
            max-width: 450px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
        }
        header h1 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 800;
            color: #a5b4fc;
        }
        .btn-top {
            background-color: var(--border);
            color: var(--text-main);
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            box-sizing: border-box;
        }
        .btn-action {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-action:hover {
            background-color: var(--primary-hover);
        }
        .score-board {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            align-items: center;
        }
        .score-team h3 {
            margin: 0;
            font-size: 0.8rem;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .score-num {
            font-size: 1.8rem;
            font-weight: 900;
            margin-top: 2px;
        }
        .score-target {
            font-size: 0.7rem;
            background-color: var(--border);
            padding: 4px 6px;
            border-radius: 6px;
            font-weight: 700;
        }
        .status-banner {
            margin: 15px 0;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            background-color: rgba(251, 191, 36, 0.1);
            color: var(--warning);
            border: 1px solid rgba(251, 191, 36, 0.2);
        }
        .battle-arena {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 15px 0;
        }
        .battle-slot {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
        }
        .slot-title {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .slot-emoji {
            font-size: 3rem;
        }
        .weapon-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .btn-weapon {
            background-color: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 12px 4px;
            font-size: 1.6rem;
            cursor: pointer;
            color: white;
        }
        .btn-weapon:hover {
            border-color: var(--primary);
            background-color: #273549;
        }
        .weapon-label {
            display: block;
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .hidden { display: none !important; }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }
        .modal-body {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            max-width: 300px;
            width: 100%;
            font-size: 0.8rem;
        }
        .modal-body h4 {
            margin: 0 0 8px 0;
            color: #a5b4fc;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
        }
        .modal-body ul {
            padding-left: 14px;
            margin: 0 0 14px 0;
            line-height: 1.5;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #475569;
        }
        @media (forced-colors: active) {
            button, select, input, .score-board, .battle-slot { border: 2px solid ButtonText !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>✊✌️✋ RPS Epic Game</h1>
        <button onclick="toggleModal('rules-modal')" class="btn-top">📖 วิธีเล่น</button>
    </header>

    <main>
        <section id="setup-screen" class="card">
            <h2 class="setup-title" style="margin:0 0 6px 0; font-size:1.2rem;">⚔️ ศึกเป่ายิ้งฉุบกู้โลก</h2>
            <p class="setup-desc" style="margin:0 0 20px 0; font-size:0.75rem; color:var(--text-muted);">สะสมแต้มการชนะให้ถึงเป้าหมายก่อนบอทเพื่อเคลียร์เลเวล</p>
            <form onsubmit="startGame(event)">
                <div class="form-group">
                    <label for="player-name">ชื่อผู้กล้าของคุณ:</label>
                    <input type="text" id="player-name" required value="ผู้กล้า">
                </div>
                <div class="form-group">
                    <label for="game-level">ระดับความยาก (เลเวล):</label>
                    <select id="game-level">
                        <option value="3">Level 1: ฝึกหัด (ชนะ 3 แต้มก่อน)</option>
                        <option value="5">Level 2: ท้าทาย (ชนะ 5 แต้มก่อน)</option>
                        <option value="7">Level 3: ปรมาจารย์ (ชนะ 7 แต้มก่อน)</option>
                    </select>
                </div>
                <button type="submit" class="btn-action">เข้าสู่สมรภูมิ</button>
            </form>
        </section>

        <section id="game-screen" class="card hidden">
            <div class="score-board">
                <div class="score-team">
                    <h3 id="display-player-name" style="color:#818cf8;">ผู้เล่น</h3>
                    <div class="score-num" id="player-score" style="color:var(--success);">0</div>
                </div>
                <div class="score-target">เป้าหมาย: <span id="target-score">3</span> แต้ม</div>
                <div class="score-team">
                    <h3 style="color:var(--danger);">บอทจอมโหด</h3>
                    <div class="score-num" id="bot-score" style="color:var(--danger);">0</div>
                </div>
            </div>

            <div id="status-message" class="status-banner">
                ศึกเริ่มแล้ว! เลือกอาวุธด้านล่าง หรือกดเลข 1, 2, 3
            </div>

            <div class="battle-arena">
                <div class="battle-slot">
                    <div class="slot-title">คุณเลือก</div>
                    <div id="player-choice-emoji" class="slot-emoji">❓</div>
                </div>
                <div class="battle-slot">
                    <div class="slot-title">บอทเลือก</div>
                    <div id="bot-choice-emoji" class="slot-emoji">❓</div>
                </div>
            </div>

            <div class="weapon-grid">
                <button onclick="playTurn('rock')" class="btn-weapon">✊<span class="weapon-label">ค้อน (1)</span></button>
                <button onclick="playTurn('paper')" class="btn-weapon">✋<span class="weapon-label">กระดาษ (2)</span></button>
                <button onclick="playTurn('scissors')" class="btn-weapon">✌️<span class="weapon-label">กรรไกร (3)</span></button>
            </div>
