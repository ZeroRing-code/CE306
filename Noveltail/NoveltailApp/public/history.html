
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/accessibility.css">

    <title>Reading History | Noveltail</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f7f7fb;
            color: #25243a;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .navbar {
            background: white;
            border-bottom: 1px solid #e9e8f0;
            padding: 16px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #7656d8;
        }

        .nav-links {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #5f5c6a;
            font-size: 14px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #7656d8;
        }

        .container {
            max-width: 1050px;
            width: 90%;
            margin: 45px auto;
        }

        .page-heading {
            margin-bottom: 28px;
        }

        .eyebrow {
            color: #7656d8;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .page-heading h1 {
            font-size: 30px;
            margin-bottom: 9px;
        }

        .page-heading p {
            color: #5f5c6a;
            font-size: 14px;
        }

        .history-feedback {
            background: white;
            border: 1px solid #e9e8f0;
            border-radius: 10px;
            padding: 15px 18px;
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .history-feedback.error {
            background: #fff5f4;
            border-color: #ffd8d3;
            color: #c0392b;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .history-card {
            display: flex;
            gap: 18px;
            background: white;
            border: 1px solid #ecebf2;
            border-radius: 13px;
            padding: 16px;
            transition: 0.2s;
        }

        .history-card:hover {
            border-color: #c8b9f5;
            box-shadow: 0 7px 20px rgba(50, 35, 90, 0.05);
        }

        .history-cover {
            width: 105px;
            min-width: 105px;
            height: 145px;
            background: #eeeaf8;
            border-radius: 9px;
            overflow: hidden;
        }

        .history-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .history-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .history-info h2 {
            font-size: 18px;
            margin: 5px 0;
            overflow-wrap: anywhere;
        }

        .history-info h2 a:hover {
            color: #7656d8;
        }

        .author {
            font-size: 12px;
            color: #5f5c6a;
            margin-bottom: 12px;
        }

        .last-chapter {
            font-size: 14px;
            color: #555;
            margin-bottom: 7px;
        }

        .last-read {
            font-size: 12px;
            color: #5f5c6a;
            margin-bottom: 14px;
        }

        .history-actions {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            margin-top: auto;
        }

        .continue-button,
        .remove-button {
            border: none;
            border-radius: 8px;
            padding: 9px 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .continue-button {
            background: #7656d8;
            color: white;
        }

        .continue-button:hover {
            background: #6243bf;
        }

        .continue-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .remove-button {
            background: #fff0f0;
            color: #a82f2f;
        }

        .remove-button:hover {
            background: #ffe0e0;
        }

        .empty-state {
            background: white;
            border: 1px dashed #d8d3e8;
            border-radius: 14px;
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .empty-state h2 {
            font-size: 20px;
            margin-bottom: 9px;
        }

        .empty-state p {
            color: #5f5c6a;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .browse-button {
            display: inline-block;
            background: #7656d8;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
        }

        [hidden] {
            display: none !important;
        }

        footer {
            text-align: center;
            color: #5f5c6a;
            font-size: 12px;
            padding: 30px;
        }

        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
            }

            .container {
                margin-top: 30px;
            }

            .page-heading h1 {
                font-size: 25px;
            }

            .history-card {
                gap: 12px;
                padding: 12px;
            }

            .history-cover {
                width: 85px;
                min-width: 85px;
                height: 120px;
            }

            .history-info h2 {
                font-size: 15px;
            }
        }
    </style>

    <script src="/csrf.js" defer></script>
    <script src="/default-images.js" defer></script>
    <script src="/history-client.js" defer></script>
    <link rel="stylesheet" href="/profile-nav.css">
    <link rel="stylesheet" href="/tailwind.css">
    <script src="/theme.js" defer></script>
</head>

<body>

<header class="navbar">
    <a href="/" class="logo">Noveltail</a>

    <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/my-novels.html">My Novels</a>
        <a href="/bookmarks.html">Bookmarks</a>
        <a href="/history.html" class="active">Reading History</a>
    </nav>
</header>

<main class="container">

    <section class="page-heading">
        <p class="eyebrow">YOUR READING ACTIVITY</p>
        <h1>Reading History</h1>
        <p>Pick up where you left off.</p>
    </section>

    <div
        id="history-feedback"
        class="history-feedback"
        role="status"
        hidden
    ></div>

    <section id="history-list" class="history-list"></section>

    <section id="empty-state" class="empty-state" hidden>
        <div class="empty-icon">📖</div>
        <h2>No reading history yet</h2>
        <p>Novels you read will appear here.</p>
        <a href="/" class="browse-button">Discover Novels</a>
    </section>

</main>

<footer>Noveltail © 2026</footer>

<script src="/profile-nav.js" defer></script>
</body>
</html>
